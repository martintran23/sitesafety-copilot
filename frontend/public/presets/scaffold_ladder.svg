<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#skyGrad)"/>
  <rect y="580" width="1000" height="120" fill="#1e293b"/>
  <line x1="0" y1="580" x2="1000" y2="580" stroke="#64748b" stroke-width="3"/>

  <!-- Concrete Building Structure / Unprotected Edge -->
  <rect x="340" y="80" width="500" height="500" fill="url(#deckGrad)" stroke="#64748b" stroke-width="4"/>
  <!-- Exposed worker near edge -->
  <circle cx="480" cy="180" r="18" fill="#f59e0b"/>
  <rect x="468" y="198" width="24" height="42" fill="#ef4444" rx="4"/>
  <line x1="472" y1="240" x2="466" y2="290" stroke="#38bdf8" stroke-width="8"/>
  <line x1="488" y1="240" x2="494" y2="290" stroke="#38bdf8" stroke-width="8"/>
  <!-- Portable Ladder resting on left side of landing -->
  <line x1="120" y1="620" x2="340" y2="280" stroke="#94a3b8" stroke-width="8"/>
  <line x1="150" y1="620" x2="370" y2="280" stroke="#94a3b8" stroke-width="8"/>
  <!-- Rungs -->
  <line x1="130" y1="580" x2="160" y2="580" stroke="#94a3b8" stroke-width="5"/>
  <line x1="165" y1="520" x2="195" y2="520" stroke="#94a3b8" stroke-width="5"/>
  <line x1="200" y1="460" x2="230" y2="460" stroke="#94a3b8" stroke-width="5"/>
  <line x1="235" y1="400" x2="265" y2="400" stroke="#94a3b8" stroke-width="5"/>
  <line x1="270" y1="340" x2="300" y2="340" stroke="#94a3b8" stroke-width="5"/>
  <line x1="305" y1="280" x2="335" y2="280" stroke="#94a3b8" stroke-width="5"/>

  <!-- Construction labels -->
  <text x="40" y="60" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">JOBSITE SECTOR 4: UPPER DECK &amp; ACCESS</text>
  <text x="40" y="95" fill="#94a3b8" font-family="monospace" font-size="16">DEMO PRESET: FALL EXPOSURE &amp; LADDER NON-COMPLIANCE</text>
</svg>
