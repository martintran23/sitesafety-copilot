<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="trenchSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="1000" height="300" fill="url(#trenchSky)"/>
  <!-- Ground level -->
  <rect y="250" width="1000" height="450" fill="url(#dirtGrad)"/>

  <!-- Trench Pit Cutout -->
  <polygon points="200,250 280,620 720,620 800,250" fill="#1c1917" stroke="#b45309" stroke-width="6"/>

  <!-- Spoil pile directly on trench lip (OSHA 1926.651(j)(2) violation) -->
  <path d="M 80,250 Q 150,150 230,250 Z" fill="#92400e" stroke="#d97706" stroke-width="3"/>
  <text x="100" y="210" fill="#fef08a" font-family="monospace" font-size="14" font-weight="bold">SPOIL LIP &lt; 2FT</text>

  <!-- Worker inside deep trench without shoring -->
  <circle cx="500" cy="480" r="16" fill="#f59e0b"/>
  <rect x="490" y="496" width="20" height="38" fill="#ea580c" rx="4"/>
  <line x1="494" y1="534" x2="490" y2="580" stroke="#0284c7" stroke-width="7"/>
  <line x1="506" y1="534" x2="510" y2="580" stroke="#0284c7" stroke-width="7"/>

  <!-- Construction labels -->
  <text x="40" y="60" fill="#f97316" font-family="sans-serif" font-size="24" font-weight="bold">SECTOR 2: TRENCH EXCAVATION PIT</text>
  <text x="40" y="95" fill="#94a3b8" font-family="monospace" font-size="16">DEMO PRESET: TRENCH SHORING &amp; EGRESS COMPLIANCE</text>
</svg>
